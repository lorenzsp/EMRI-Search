[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=7.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emrisearch"
description = "A package for EMRI (Extreme Mass Ratio Inspirals) Search"
authors = [{name = "Aldo Baglio", email="brambilla.fumagalli@cadrega.it"}, {name="Giovanni Storti"}, {name="Giacomo Poretti"}]
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE.md"}
keywords = ["gravitational-waves", "EMRI", "LISA", "parameter-estimation", "mcmc"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

dynamic = ["version"]

dependencies = [
    "eryn",
    "fastlisaresponse",
    "few-waveforms",
    "h5py",
    "interpax",
    "jax",
    "jaxlib",
    "lisatools",
    "matplotlib",
    "numpy",
    "optax",
    "scipy",
    "torch",
]

[project.optional-dependencies]
examples = [
    "astropy",
    "corner",
    "jupyter",
    "multiprocess",
    "pandas",
    "tqdm",
]


[project.urls]
Homepage = "https://github.com/lorenzosp/EMRI-Search"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["emrisearch"]

[tool.setuptools.package-data]
emrisearch = ["data/*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
