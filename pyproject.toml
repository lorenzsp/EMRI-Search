[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=7.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emrisearch"
description = "A package for EMRI (Extreme Mass Ratio Inspirals) Search"
authors = [{name = ""}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/lorenzosp/EMRI-Search"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["emrisearch"]

[tool.setuptools.package-data]
emrisearch = ["data/*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
